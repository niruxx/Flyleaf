[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flyleaf-desktop"
version = "0.1.0"
description = "A native Qt 6 desktop client for Flyleaf servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PySide6-Essentials==6.12.0"]

[project.gui-scripts]
flyleaf-desktop = "flyleaf_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flyleaf_desktop = ["resources/*.svg"]
