[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flyleaf-desktop"
version = "0.1.0"
description = "A native Qt 6 desktop client for Flyleaf servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PySide6-Essentials==6.12.0", "PyMuPDF==1.26.7", "Pillow==12.1.0",
  "python-vlc==3.0.21203", "pyttsx3==2.99",
  "pywin32==312; sys_platform == 'win32'",
  "dbus-next==0.2.3; sys_platform == 'linux'",
  "winrt-Windows.Media.Interop==4.0.0; sys_platform == 'win32'",
  "winrt-Windows.Media==4!10.0.28000.2957; sys_platform == 'win32'",
  "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==4!10.0.28000.2957; sys_platform == 'win32'",
  "winrt-runtime==4.2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
sessions = ["SecretStorage==3.5.0; sys_platform == 'linux'"]

[project.gui-scripts]
flyleaf-desktop = "flyleaf_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flyleaf_desktop = ["resources/*.svg", "resources/fonts/*.ttf", "resources/fonts/*.txt"]
