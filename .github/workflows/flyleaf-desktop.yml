name: Native desktop checks

on:
  push:
    branches: [feature/desktop-client]
    paths:
      - desktop/**
      - .github/workflows/flyleaf-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    if: github.ref == 'refs/heads/feature/desktop-client'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Linux platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
      - name: Install the native toolkit without browser addons
        run: python -m pip install --only-binary=:all: -r desktop/requirements.txt
      - name: Native widget and HTTP contract tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Validate the Python package
        run: python -m pip wheel --no-deps ./desktop --wheel-dir desktop/dist
