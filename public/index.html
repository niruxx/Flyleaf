<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flyleaf</title>
    <meta name="description" content="Your self-hosted library for books, manga and comics." />

    <!-- Installable web app (iOS + Android) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flyleaf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />

    <script>
      // Apply the cached theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('flyleaf.themeState') || '{}');
        var r = document.documentElement;
        if (t.mode === 'light' || t.mode === 'dark') r.dataset.theme = t.mode;
        if (t.hue != null) r.style.setProperty('--seed-hue', t.hue);
        if (t.chroma != null) r.style.setProperty('--seed-chroma', t.chroma);
        if (t.oled) r.dataset.oled = '';
        if (t.noMotion) r.classList.add('no-motion');
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="/css/m3.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/ambience.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <link rel="stylesheet" href="/css/reader.css" />
    <link rel="stylesheet" href="/css/expressive.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body class="bare">
    <!-- Soft drifting colour and a dot grid behind the app (hidden when you set your own background). -->
    <div class="ambient" aria-hidden="true">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <div class="dots"></div>
    </div>
    <header class="app-bar">
      <div class="start">
        <button class="icon-btn state menu-toggle" type="button" aria-label="Open navigation" title="Menu" aria-controls="app-navigation" aria-expanded="false">
          <span class="icon">menu</span>
        </button>
        <a class="brand" href="#/" aria-label="Flyleaf home">
          <span class="logo"><span class="icon filled">auto_stories</span></span>
          <span class="word">Flyleaf</span>
        </a>
      </div>
      <div class="app-search" role="search"></div>
      <div class="end"></div>
    </header>

    <nav id="app-navigation" class="drawer" aria-label="Library navigation"></nav>
    <div class="scrim"></div>

    <a class="skip-link" href="#view">Skip to content</a>
    <main id="view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main">
      <a href="#/" data-nav="home"><span class="pill state"><span class="icon">home</span></span>Home</a>
      <a href="#/library" data-nav="library"><span class="pill state"><span class="icon">local_library</span></span>Library</a>
      <a href="#/want-to-read" data-nav="want"><span class="pill state"><span class="icon">bookmark_heart</span></span>Want to read</a>
      <a href="#/bookmarks" data-nav="bookmarks"><span class="pill state"><span class="icon">bookmarks</span></span>Bookmarks</a>
    </nav>

    <div class="snackbar-host" aria-live="polite"></div>
  </body>
</html>
